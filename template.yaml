AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HeatShield heat-risk planner for outdoor workers

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref HeatShieldTable
        HEATSHIELD_DEMO: 'false'
        TELEGRAM_TOKEN_PARAMETER: /heatshield/telegram-token
        TELEGRAM_WEBHOOK_SECRET_PARAMETER: /heatshield/telegram-webhook-secret
        TELEGRAM_BOT_USERNAME: HeatShieldBot
        USE_BEDROCK: 'false'
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        SUPERVISOR_KEY: ''

Resources:
  HeatShieldApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'authorization', 'x-requested-with', 'x-telegram-bot-api-secret-token', 'x-api-key']
        AllowMethods: [GET, POST, OPTIONS]

  HeatShieldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HeatShieldTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/heatshield/*'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HeatShieldApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HeatShieldApi
            Path: /{proxy+}
            Method: ANY


  HeatShieldTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  MorningPlanSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'cron(0 6 * * ? *)'
      ScheduleExpressionTimezone: Asia/Kolkata
      Target:
        Arn: !GetAtt HeatShieldFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"requestContext":{"http":{"method":"POST"}},"rawPath":"/api/plan","body":"{\"scheduled\":true}"}'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeHeatShield
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HeatShieldFunction.Arn

Outputs:
  ApiUrl:
    Value: !Sub https://${HeatShieldApi}.execute-api.${AWS::Region}.amazonaws.com

